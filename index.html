
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeedBridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172033}
header{background:#075985;color:white;text-align:center;padding:20px}
main{max-width:850px;margin:20px auto;padding:12px}
section,.post{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
button{padding:11px 16px;border:0;border-radius:7px;background:#0284c7;color:white;margin:5px;cursor:pointer}
.green{background:#15803d}.danger{background:#dc2626}.gray{background:#475569}
.hidden{display:none}
.post{border-right:5px solid #0284c7}
#message{padding:12px}
</style>
</head>
<body>
<header>
<h1>NeedBridge</h1>
<p>د مرستې نړیوال وړیا پلیټفارم</p>
<button class="gray" onclick="toggleLanguage()">English / پښتو</button>
</header>
<main>
<div id="message"></div>

<section>
<h2>Login / Signup</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<button class="danger" onclick="logout()">Logout</button>
<p id="userStatus">Not logged in</p>
</section>

<section>
<h2>د مرستې غوښتنه</h2>
<input id="postTitle" placeholder="د غوښتنې سرلیک">
<select id="category">
<option value="">کټګوري انتخاب کړه</option>
<option>Food</option>
<option>Education</option>
<option>Healthcare</option>
<option>Visa</option>
<option>Clothing</option>
<option>Volunteering</option>
</select>
<textarea id="description" placeholder="د اړتیا معلومات"></textarea>
<input id="country" placeholder="Country">
<input id="city" placeholder="City">
<button onclick="submitPost()">Submit Help Request</button>
</section>

<section>
<h2>Help Categories</h2>
<p>🍚 Food | 📚 Education | 🏥 Healthcare</p>
<p>🛂 Visa | 👕 Clothing | 🤝 Volunteering</p>
</section>

<section>
<h2>Help Requests</h2>
<button onclick="loadRequests()">Refresh</button>
<div id="posts">Loading...</div>
</section>

<section id="adminPanel" class="hidden">
<h2>Admin Panel</h2>
<p>You are an Admin</p>
<div id="adminPosts"></div>
</section>

<section id="reportsPanel" class="hidden">
<h2>Admin Reports Panel</h2>
<button onclick="loadReports()">Refresh Reports</button>
<div id="reportList">Loading...</div>
</section>
</main>

<script>
const SUPABASE_URL="https://urozgfqxtbjmejyyocow.supabase.co";

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyb3pnZnF4dGJqbWVqeXlvY293Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDgxOTcsImV4cCI6MjEwOTU4NDE5N30.3QxdIJP1EdKtUz2lvtzb1x-K1wOOVcRaMjdG5pYUnb0";

const ADMIN_ID="0226963d-a946-498c-a977-f3eeac1c02f3";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let isAdmin=false;
let language="ps";

function msg(t){
 document.getElementById("message").textContent=t;
}

function safe(v){
 return String(v||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password)return msg("Email او Password ولیکه");
 const {error}=await db.auth.signUp({email,password});
 msg(error?error.message:"حساب جوړ شو. خپل Email تایید کړه که غوښتنه یې وشي.");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password)return msg("Email او Password ولیکه");
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error)return msg(error.message);
 msg("Login successful");
 await updateUser();
}

async function logout(){
 const {error}=await db.auth.signOut();
 if(error)return msg(error.message);
 currentUser=null;isAdmin=false;
 updateUI();msg("Logout successful");
}

function updateUI(){
 document.getElementById("userStatus").textContent=
 currentUser?"Logged in: "+currentUser.email:"Not logged in";
 document.getElementById("adminPanel").classList.toggle("hidden",!isAdmin);
 document.getElementById("reportsPanel").classList.toggle("hidden",!isAdmin);
}

async function updateUser(){
 const {data,error}=await db.auth.getUser();
 if(error){msg(error.message);return}
 currentUser=data.user||null;
 isAdmin=false;

 if(currentUser){
  const {data:a,error:e}=await db.from("nb_admins")
   .select("user_id").eq("user_id",currentUser.id).maybeSingle();
  if(!e&&a)isAdmin=true;
 }
 updateUI();
 await loadRequests();
 if(isAdmin)await loadReports();
}

async function submitPost(){
 if(!currentUser)return msg("لومړی Login وکړه");
 const title=document.getElementById("postTitle").value.trim();
 const category=document.getElementById("category").value;
 const description=document.getElementById("description").value.trim();
 const country=document.getElementById("country").value.trim();
 const city=document.getElementById("city").value.trim();

 if(!title||!category||!description)return msg("ټول ضروري معلومات ولیکه");

 const {error}=await db.from("nb_posts").insert({
  owner_id:currentUser.id,
  title,
  post_type:"request",
  status:"pending",
  description:"Category: "+category+"\n"+description,
  country,city
 });

 if(error)return msg(error.message);
 msg("Your help request has been submitted.");
 document.getElementById("postTitle").value="";
 document.getElementById("description").value="";
 document.getElementById("country").value="";
 document.getElementById("city").value="";
 await loadRequests();
}

async function loadRequests(){
 const posts=document.getElementById("posts");
 const admin=document.getElementById("adminPosts");
 posts.textContent="Loading...";
 const {data,error}=await db.from("nb_posts")
  .select("id,owner_id,title,status,description,country,city,created_at")
  .order("created_at",{ascending:false});

 if(error){posts.textContent="Error: "+error.message;return}
 posts.innerHTML="";
 admin.innerHTML="";
 if(!data||!data.length){posts.textContent="No requests found";return}

 data.forEach(p=>{
  const div=document.createElement("div");
  div.className="post";
  div.innerHTML="<h3>"+safe(p.title)+"</h3><p>"+safe(p.description)+"</p><p>"+safe(p.city)+" "+safe(p.country)+"</p><b>Status: "+safe(p.status)+"</b>";

  if(currentUser&&p.owner_id!==currentUser.id&&p.status==="approved"){
   const b=document.createElement("button");
   b.className="danger";b.textContent="Report";
   b.onclick=()=>reportPost(p.id);
   div.appendChild(b);
  }
  posts.appendChild(div);

  if(isAdmin&&p.status==="pending"){
   const a=document.createElement("div");
   a.className="post";
   a.innerHTML="<h3>"+safe(p.title)+"</h3><p>"+safe(p.description)+"</p>";

   const yes=document.createElement("button");
   yes.className="green";yes.textContent="Approve";
   yes.onclick=()=>changePostStatus(p.id,"approved");

   const no=document.createElement("button");
   no.className="danger";no.textContent="Reject";
   no.onclick=()=>changePostStatus(p.id,"rejected");

   a.append(yes,no);
   admin.appendChild(a);
  }
 });
}

async function changePostStatus(id,status){
 if(!isAdmin)return msg("Admin access required");
 const {error}=await db.from("nb_posts").update({status})
  .eq("id",id);
 if(error)return msg("Update error: "+error.message);
 msg("Status changed: "+status);
 await loadRequests();
}

async function reportPost(id){
 if(!currentUser)return msg("لومړی Login وکړه");
 const reason=prompt("د راپور دلیل ولیکه:");
 if(!reason||!reason.trim())return;

 const {error}=await db.from("nb_reports").insert({
  reporter_id:currentUser.id,
  post_id:id,
  reason:reason.trim()
 });
 if(error)return msg("Report error: "+error.message);
 msg("Report submitted.");
}

async function loadReports(){
 if(!isAdmin)return;
 const box=document.getElementById("reportList");
 box.textContent="Loading reports...";

 const {data,error}=await db.from("nb_reports")
  .select("id,post_id,reporter_id,reason,status,created_at")
  .order("created_at",{ascending:false});

 if(error){box.textContent="Reports error: "+error.message;return}
 box.innerHTML="";
 if(!data||!data.length){box.textContent="No reports found.";return}

 data.forEach(r=>{
  const div=document.createElement("div");
  div.className="post";
  div.innerHTML="<h3>Report</h3><p>Post ID: "+safe(r.post_id)+"</p><p>Reason: "+safe(r.reason)+"</p><p>Reporter: "+safe(r.reporter_id)+"</p><p>Status: "+safe(r.status)+"</p><p>Date: "+safe(r.created_at)+"</p>";

  if(r.status!=="reviewed"){
   const b=document.createElement("button");
   b.className="green";
   b.textContent="Mark Reviewed";
   b.onclick=()=>markReviewed(r.id);
   div.appendChild(b);
  }
  box.appendChild(div);
 });
}

async function markReviewed(id){
 if(!isAdmin)return msg("Admin access required");
 const {error}=await db.from("nb_reports")
  .update({status:"reviewed"}).eq("id",id);
 if(error)return msg("Review error: "+error.message);
 msg("Report marked as reviewed.");
 await loadReports();
}

function toggleLanguage(){
 language=language==="ps"?"en":"ps";
 document.documentElement.lang=language;
 document.documentElement.dir=language==="ps"?"rtl":"ltr";
 msg(language==="ps"?"پښتو ژبه":"English language");
}

db.auth.onAuthStateChange(()=>{
 setTimeout(()=>updateUser(),0);
});

updateUser();
</script>
</body>
</html>
