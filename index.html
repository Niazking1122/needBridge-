
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeedBridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;color:#172033}
header{background:#075985;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:20px auto;padding:12px}
section,.post{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
button{padding:11px 16px;border:0;border-radius:7px;background:#0284c7;color:white;margin:5px;cursor:pointer;font-size:15px}
button.danger{background:#dc2626}
button.green{background:#15803d}
button.gray{background:#475569}
.post{border-right:5px solid #0284c7}
.hidden{display:none}
.status{font-weight:bold;color:#075985}
#message{padding:12px;margin:10px 0;border-radius:7px}
</style>
</head>
<body>

<header>
<h1>NeedBridge</h1>
<p>د مرستې نړیوال وړیا پلیټفارم</p>
<button onclick="toggleLanguage()" class="gray">English / پښتو</button>
</header>

<main>

<div id="message"></div>

<section>
<h2 id="authTitle">Login / حساب ته ننوتل</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<button onclick="logout()" class="danger">Logout</button>
<p id="userStatus">لاګین نه یې</p>
</section>

<section>
<h2>د مرستې غوښتنه</h2>
<input id="postTitle" placeholder="د غوښتنې سرلیک">
<select id="category">
<option value="">کټګوري انتخاب کړه</option>
<option>Food</option>
<option>Education</option>
<option>Healthcare</option>
<option>Visa</option>
<option>Clothing</option>
<option>Volunteering</option>
</select>
<textarea id="description" placeholder="د خپلې اړتیا په اړه معلومات ولیکه"></textarea>
<input id="country" placeholder="Country">
<input id="city" placeholder="City">
<button onclick="submitPost()">Submit Help Request</button>
</section>

<section>
<h2>د مرستې کټګورۍ</h2>
<p>🍚 Food | 📚 Education | 🏥 Healthcare</p>
<p>🛂 Visa | 👕 Clothing | 🤝 Volunteering</p>
</section>

<section>
<h2>د مرستې غوښتنې</h2>
<button onclick="loadRequests()">Refresh Requests</button>
<div id="posts">Loading...</div>
</section>

<section id="adminPanel" class="hidden">
<h2>Admin Panel</h2>
<p>You are an Admin</p>
<div id="adminPosts"></div>
</section>

<section id="reportsPanel" class="hidden">
<h2>Admin Reports Panel</h2>
<button onclick="loadReports()">Refresh Reports</button>
<div id="reportList">Loading reports...</div>
</section>

</main>

<script>
const SUPABASE_URL = "https://urozgfqxtbjmejyyocow.supabase.co";
const SUPABASE_KEY = "sb_publishable_bac4hezW3ubW7BtEBjdi3g_3Qjrbv9";

const ADMIN_ID = "0226963d-a946-498c-a977-f3eeac1c02f3";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let isAdmin = false;
let language = "ps";

function msg(text){
  document.getElementById("message").textContent = text;
}

function escapeHTML(value){
  return String(value || "").replace(/[&<>"']/g, function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    msg("Email او Password ولیکه");
    return;
  }

  const {error} = await db.auth.signUp({
    email,
    password
  });

  if(error){
    msg(error.message);
    return;
  }

  msg("حساب جوړ شو. که Email confirmation وغواړي، خپل Email تایید کړه.");
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    msg("Email او Password ولیکه");
    return;
  }

  const {error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    msg(error.message);
    return;
  }

  msg("Login successful");
  await updateUser();
}

async function logout(){
  const {error} = await db.auth.signOut();

  if(error){
    msg(error.message);
    return;
  }

  currentUser = null;
  isAdmin = false;
  updateUI();
  msg("Logout successful");
}

function updateUI(){
  document.getElementById("userStatus").textContent =
    currentUser ? "Logged in: " + currentUser.email : "لاګین نه یې";

  document.getElementById("adminPanel").classList.toggle("hidden", !isAdmin);
  document.getElementById("reportsPanel").classList.toggle("hidden", !isAdmin);
}

async function updateUser(){
  const {data} = await db.auth.getUser();
  currentUser = data.user || null;
  isAdmin = false;

  if(currentUser){
    const {data: adminData, error} = await db
      .from("nb_admins")
      .select("user_id")
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if(!error && adminData){
      isAdmin = true;
    }
  }

  updateUI();
  await loadRequests();

  if(isAdmin){
    await loadReports();
  }
}

async function submitPost(){
  if(!currentUser){
    msg("لومړی Login وکړه");
    return;
  }

  const title = document.getElementById("postTitle").value.trim();
  const category = document.getElementById("category").value;
  const description = document.getElementById("description").value.trim();
  const country = document.getElementById("country").value.trim();
  const city = document.getElementById("city").value.trim();

  if(!title || !category || !description){
    msg("سرلیک، کټګوري او معلومات ولیکه");
    return;
  }

  const {error} = await db.from("nb_posts").insert({
    owner_id: currentUser.id,
    title: title,
    post_type: "request",
    status: "pending",
    description: "Category: " + category + "\n" + description,
    country: country,
    city: city
  });

  if(error){
    msg("Error: " + error.message);
    return;
  }

  msg("Your help request has been submitted.");
  document.getElementById("postTitle").value = "";
  document.getElementById("description").value = "";
  document.getElementById("country").value = "";
  document.getElementById("city").value = "";

  await loadRequests();
}

async function loadRequests(){
  const postsBox = document.getElementById("posts");
  const adminBox = document.getElementById("adminPosts");

  postsBox.textContent = "Loading...";

  const {data, error} = await db
    .from("nb_posts")
    .select("id,owner_id,title,post_type,status,description,country,city,created_at")
    .order("created_at", {ascending:false});

  if(error){
    postsBox.textContent = "Error: " + error.message;
    return;
  }

  postsBox.innerHTML = "";
  adminBox.innerHTML = "";

  if(!data || data.length === 0){
    postsBox.textContent = "No requests found.";
    return;
  }

  data.forEach(post => {
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <h3>${escapeHTML(post.title)}</h3>
      <p>${escapeHTML(post.description)}</p>
      <p>${escapeHTML(post.city)} ${escapeHTML(post.country)}</p>
      <p class="status">Status: ${escapeHTML(post.status)}</p>
    `;

    if(currentUser && post.owner_id !== currentUser.id &&
       post.status === "approved"){
      const reportBtn = document.createElement("button");
      reportBtn.className = "danger";
      reportBtn.textContent = "Report";
      reportBtn.onclick = () => reportPost(post.id);
      div.appendChild(reportBtn);
    }

    postsBox.appendChild(div);

    if(isAdmin && post.status === "pending"){
      const adminDiv = document.createElement("div");
      adminDiv.className = "post";
      adminDiv.innerHTML =
        `<h3>${escapeHTML(post.title)}</h3>
         <p>${escapeHTML(post.description)}</p>`;

      const approveBtn = document.createElement("button");
      approveBtn.className = "green";
      approveBtn.textContent = "Approve";
      approveBtn.onclick = () => changePostStatus(post.id, "approved");

      const rejectBtn = document.createElement("button");
      rejectBtn.className = "danger";
      rejectBtn.textContent = "Reject";
      rejectBtn.onclick = () => changePostStatus(post.id, "rejected");

      adminDiv.appendChild(approveBtn);
      adminDiv.appendChild(rejectBtn);
      adminBox.appendChild(adminDiv);
    }
  });
}

async function changePostStatus(postId, status){
  if(!isAdmin){
    msg("Admin access required");
    return;
  }

  const {error} = await db
    .from("nb_posts")
    .update({status:status})
    .eq("id", postId);

  if(error){
    msg("Update error: " + error.message);
    return;
  }

  msg("Request status changed to " + status);
  await loadRequests();
}

async function reportPost(postId){
  if(!currentUser){
    msg("لومړی Login وکړه");
    return;
  }

  const reason = prompt("د راپور دلیل ولیکه:");

  if(!reason || !reason.trim()){
    return;
  }

  const {error} = await db.from("nb_reports").insert({
    reporter_id: currentUser.id,
    post_id: postId,
    reason: reason.trim()
  });

  if(error){
    msg("Report error: " + error.message);
    return;
  }

  msg("Report submitted.");
}

async function loadReports(){
  if(!isAdmin){
    return;
  }

  const box = document.getElementById("reportList");
  box.textContent = "Loading reports...";

  const {data, error} = await db
    .from("nb_reports")
    .select("id,post_id,reporter_id,reason,status,created_at")
    .order("created_at", {ascending:false});

  if(error){
    box.textContent = "Reports error: " + error.message;
    return;
  }

  box.innerHTML = "";

  if(!data || data.length === 0){
    box.textContent = "No reports found.";
    return;
  }

  data.forEach(report => {
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <h3>Report</h3>
      <p>Post ID: ${escapeHTML(report.post_id)}</p>
      <p>Reason: ${escapeHTML(report.reason)}</p>
      <p>Reporter: ${escapeHTML(report.reporter_id)}</p>
      <p>Status: ${escapeHTML(report.status)}</p>
      <p>Date: ${escapeHTML(report.created_at)}</p>
    `;

    if(report.status !== "reviewed"){
      const button = document.createElement("button");
      button.className = "green";
      button.textContent = "Mark Reviewed";
      button.onclick = () => markReviewed(report.id);
      div.appendChild(button);
    }

    box.appendChild(div);
  });
}

async function markReviewed(reportId){
  if(!isAdmin){
    msg("Admin access required");
    return;
  }

  const {error} = await db
    .from("nb_reports")
    .update({status:"reviewed"})
    .eq("id", reportId);

  if(error){
    msg("Review error: " + error.message);
    return;
  }

  msg("Report marked as reviewed.");
  await loadReports();
}

function toggleLanguage(){
  language = language === "ps" ? "en" : "ps";
  document.documentElement.lang = language;
  document.documentElement.dir = language === "ps" ? "rtl" : "ltr";
  msg(language === "ps" ? "پښتو ژبه" : "English language");
}

db.auth.onAuthStateChange(() => {
  setTimeout(() => {
    updateUser();
  }, 0);
});

updateUser();
</script>
</body>
</html>
