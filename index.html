
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeedBridge</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px;color:#172554}
header,section{background:white;padding:18px;margin:15px auto;border-radius:12px;max-width:550px;text-align:center}
header{background:#075985;color:white}
input,textarea,select{box-sizing:border-box;width:95%;padding:12px;margin:8px;border:1px solid #ccc;border-radius:8px}
button{background:#0284c7;color:white;border:0;padding:12px 18px;border-radius:8px;margin:5px;cursor:pointer}
.approve{background:#15803d}
.reject{background:#dc2626}
.report{background:#b45309}
.request-card{background:#f1f5f9;padding:12px;margin:10px 0;border-radius:8px;text-align:start;overflow-wrap:anywhere}
#message,#requestMessage{color:#075985}
#adminStatus{color:#15803d;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>NeedBridge</h1>
<p id="welcome">د مرستې پل — وړیا مرسته د ټولو لپاره</p>
<button onclick="changeLang('ps')">پښتو</button>
<button onclick="changeLang('en')">English</button>
</header>

<section>
<h2 id="authTitle">نوی حساب جوړ کړئ</h2>
<input id="name" placeholder="بشپړ نوم">
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="پاسورډ">
<button id="signupBtn" onclick="signup()">حساب جوړول</button>
<button id="loginBtn" onclick="login()">ننوتل</button>
<button id="logoutBtn" onclick="logout()" hidden>وتل</button>
<p id="userStatus"></p>
<p id="adminStatus"></p>
<p id="message"></p>
</section>

<section id="requestSection" hidden>
<h2 id="requestTitle">د مرستې غوښتنه ثبت کړئ</h2>
<input id="title" placeholder="د غوښتنې سرلیک">
<select id="category">
<option value="Food">خواړه</option>
<option value="Education">زده کړې</option>
<option value="Healthcare">روغتیا</option>
<option value="Visa">ویزه</option>
<option value="Clothing">جامې</option>
<option value="Volunteering">رضاکارانه مرسته</option>
</select>
<textarea id="description" placeholder="خپله غوښتنه تشریح کړئ"></textarea>
<input id="country" placeholder="هېواد">
<input id="city" placeholder="ښار">
<button id="submitBtn" onclick="submitRequest()">غوښتنه ثبتول</button>
<p id="requestMessage"></p>
</section>

<section id="requestsSection">
<h2 id="requestsTitle">د خلکو د مرستې غوښتنې</h2>
<button onclick="loadRequests()" id="refreshBtn">بیا تازه کول</button>
<div id="publicRequests"></div>
</section>

<section>
<h2 id="categoriesTitle">د مرستې برخې</h2>
<div id="categories"></div>
</section>

<section id="adminReportsSection" hidden>
<h2 id="adminReportsTitle">Admin Reports Panel</h2>
<button onclick="loadAdminReports()" id="reportsRefresh">Refresh Reports</button>
<div id="reportList"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient(
"https://urozgfqxtbjmejyyocow.supabase.co",
"sb_publishable_bac4hezW3ubW7BtEBjdi3g_3Qjrbv9T"
);

const $=id=>document.getElementById(id);
let lang="ps";
let currentUser=null;
let isAdmin=false;

const words={
ps:{
welcome:"د مرستې پل — وړیا مرسته د ټولو لپاره",
auth:"نوی حساب جوړ کړئ",name:"بشپړ نوم",email:"ایمیل",
password:"پاسورډ",signup:"حساب جوړول",login:"ننوتل",
logout:"وتل",request:"د مرستې غوښتنه ثبت کړئ",
title:"د غوښتنې سرلیک",description:"خپله غوښتنه تشریح کړئ",
country:"هېواد",city:"ښار",submit:"غوښتنه ثبتول",
categories:"د مرستې برخې",requests:"د خلکو د مرستې غوښتنې",
refresh:"بیا تازه کول",
items:["خواړه","زده کړې","روغتیا","ویزه","جامې","رضاکارانه مرسته"],
need:"مهرباني وکړئ اړین معلومات بشپړ کړئ.",
success:"حساب جوړ شو. خپل ایمیل وګورئ.",
logged:"په بریالیتوب سره ننوتل.",
saved:"ستاسو د مرستې غوښتنه ثبت شوه.",
loading:"مهرباني وکړئ انتظار وکړئ...",
signed:"تاسو ننوتلي یاست: ",
error:"ستونزه: ",empty:"اوسمهال غوښتنې نشته.",
status:"حالت: ",cityLabel:"ښار: ",
admin:"تاسو Admin یاست.",
approve:"تایید",reject:"رد",
approved:"غوښتنه تایید شوه.",
rejected:"غوښتنه رد شوه.",
pending:"د تایید په تمه",
approvedStatus:"تایید شوې",
rejectedStatus:"رد شوې",
report:"Report کول",
reportReason:"د Report دلیل ولیکئ:",
reportSent:"Report واستول شو.",
reportEmpty:"د Report دلیل ولیکئ.",
reports:"د Admin راپورونه",
noReports:"تر اوسه Report نشته.",
reviewed:"کتل شوی",
markReviewed:"د کتلو حالت ورکړه",
reporter:"راپور ورکوونکی",
post:"پوسټ",
reason:"دلیل"
},
en:{
welcome:"The Bridge of Help — Free Help for Everyone",
auth:"Create a New Account",name:"Full Name",email:"Email",
password:"Password",signup:"Sign Up",login:"Login",
logout:"Logout",request:"Submit a Help Request",
title:"Request Title",description:"Describe your request",
country:"Country",city:"City",submit:"Submit Request",
categories:"Help Categories",requests:"Community Help Requests",
refresh:"Refresh",
items:["Food","Education","Healthcare","Visa","Clothing","Volunteering"],
need:"Please complete the required fields.",
success:"Account created. Check your email.",
logged:"Login successful.",
saved:"Your help request has been submitted.",
loading:"Please wait...",
signed:"You are logged in: ",
error:"Error: ",empty:"No requests available.",
status:"Status: ",cityLabel:"City: ",
admin:"You are an Admin.",
approve:"Approve",reject:"Reject",
approved:"Request approved.",
rejected:"Request rejected.",
pending:"Pending",
approvedStatus:"Approved",
rejectedStatus:"Rejected",
report:"Report",
reportReason:"Enter report reason:",
reportSent:"Report submitted.",
reportEmpty:"Please enter a report reason.",
reports:"Admin Reports Panel",
noReports:"No reports available.",
reviewed:"Reviewed",
markReviewed:"Mark Reviewed",
reporter:"Reporter",
post:"Post",
reason:"Reason"
}
};

function changeLang(l){
lang=l;
document.documentElement.lang=l;
document.documentElement.dir=l==="ps"?"rtl":"ltr";
const w=words[l];

$("welcome").textContent=w.welcome;
$("authTitle").textContent=w.auth;
$("name").placeholder=w.name;
$("email").placeholder=w.email;
$("password").placeholder=w.password;
$("signupBtn").textContent=w.signup;
$("loginBtn").textContent=w.login;
$("logoutBtn").textContent=w.logout;
$("requestTitle").textContent=w.request;
$("title").placeholder=w.title;
$("description").placeholder=w.description;
$("country").placeholder=w.country;
$("city").placeholder=w.city;
$("submitBtn").textContent=w.submit;
$("categoriesTitle").textContent=w.categories;
$("requestsTitle").textContent=w.requests;
$("refreshBtn").textContent=w.refresh;
$("adminReportsTitle").textContent=w.reports;
$("reportsRefresh").textContent=w.refresh;

$("category").innerHTML=w.items.map((x,i)=>
`<option value="${["Food","Education","Healthcare","Visa","Clothing","Volunteering"][i]}">${x}</option>`
).join("");

$("categories").replaceChildren();
w.items.forEach(x=>{
const p=document.createElement("p");
p.textContent=x;
$("categories").appendChild(p);
});

$("adminStatus").textContent=isAdmin?w.admin:"";
}

function msg(t){$("message").textContent=t;}

async function signup(){
const n=$("name").value.trim();
const e=$("email").value.trim();
const p=$("password").value;
if(!n||!e||!p){msg(words[lang].need);return;}
msg(words[lang].loading);
const {error}=await db.auth.signUp({
email:e,password:p,options:{data:{full_name:n}}
});
if(error)msg(words[lang].error+error.message);
else msg(words[lang].success);
}

async function login(){
const e=$("email").value.trim();
const p=$("password").value;
if(!e||!p){msg(words[lang].need);return;}
msg(words[lang].loading);
const {error}=await db.auth.signInWithPassword({email:e,password:p});
if(error)msg(words[lang].error+error.message);
else{
msg(words[lang].logged);
await updateUser();
}
}

async function logout(){
const {error}=await db.auth.signOut();
if(error)msg(words[lang].error+error.message);
else msg(words[lang].logout);
await updateUser();
}

async function checkAdmin(){
isAdmin=false;
if(!currentUser)return;
const {data,error}=await db.from("nb_admins")
.select("user_id")
.eq("user_id",currentUser.id)
.maybeSingle();
if(error){console.error(error.message);return;}
isAdmin=!!data;
}

async function updateUser(){
const {data}=await db.auth.getUser();
currentUser=data.user||null;

$("userStatus").textContent=currentUser?
words[lang].signed+currentUser.email:"";
$("requestSection").hidden=!currentUser;
$("requestsSection").hidden=false;
$("logoutBtn").hidden=!currentUser;
$("signupBtn").hidden=!!currentUser;
$("loginBtn").hidden=!!currentUser;
$("name").hidden=!!currentUser;

await checkAdmin();
$("adminStatus").textContent=isAdmin?words[lang].admin:"";
$("adminReportsSection").hidden=!isAdmin;

await loadRequests();
if(isAdmin)await loadAdminReports();
}

async function submitRequest(){
if(!currentUser)return;
const t=$("title").value.trim();
const d=$("description").value.trim();
const c=$("country").value.trim();
const cityName=$("city").value.trim();

if(!t||!d||!c||!cityName){
$("requestMessage").textContent=words[lang].need;
return;
}

$("requestMessage").textContent=words[lang].loading;
const chosenCategory=$("category").value;
const {error}=await db.from("nb_posts").insert({
owner_id:currentUser.id,
title:t,
post_type:"request",
status:"pending",
description:"Category: "+chosenCategory+"\n"+d,
country:c,
city:cityName
});

if(error){
$("requestMessage").textContent=words[lang].error+error.message;
}else{
$("requestMessage").textContent=words[lang].saved;
$("title").value="";
$("description").value="";
$("country").value="";
$("city").value="";
await loadRequests();
}
}

function statusText(status){
const w=words[lang];
if(status==="pending")return w.pending;
if(status==="approved")return w.approvedStatus;
if(status==="rejected")return w.rejectedStatus;
return status||"";
}

async function reviewRequest(postId,newStatus){
if(!isAdmin)return;
const w=words[lang];
const message=newStatus==="approved"?w.approved:w.rejected;
if(!confirm(message+"?"))return;

const {error}=await db.from("nb_posts")
.update({
status:newStatus,
reviewed_at:new Date().toISOString(),
reviewed_by:currentUser.id
})
.eq("id",postId);

if(error){alert(w.error+error.message);return;}
alert(message);
await loadRequests();
}

async function reportPost(postId){
if(!currentUser){
alert("Please login to report.");
return;
}
const reason=prompt(words[lang].reportReason);
if(!reason||!reason.trim())return;

const {error}=await db.from("nb_reports").insert({
reporter_id:currentUser.id,
post_id:postId,
reason:reason.trim()
});

if(error)alert(words[lang].error+error.message);
else alert(words[lang].reportSent);
}

async function loadRequests(){
const box=$("publicRequests");
box.textContent=words[lang].loading;

const {data,error}=await db.from("nb_posts")
.select("id,owner_id,title,description,country,city,status,created_at")
.order("created_at",{ascending:false})
.limit(50);

if(error){
box.textContent=words[lang].error+error.message;
return;
}
box.replaceChildren();

if(!data||data.length===0){
box.textContent=words[lang].empty;
return;
}

data.forEach(post=>{
const card=document.createElement("div");
card.className="request-card";

const heading=document.createElement("h3");
heading.textContent=post.title||"";
const desc=document.createElement("p");
desc.textContent=(post.description||"").replace(/^Category:\s*[^\n]*\n?/,"");
const location=document.createElement("p");
location.textContent=words[lang].cityLabel+(post.city||"")+
(post.country?" — "+post.country:"");
const status=document.createElement("p");
status.textContent=words[lang].status+statusText(post.status);
card.append(heading,desc,location,status);

if(isAdmin&&post.status==="pending"){
const approveBtn=document.createElement("button");
approveBtn.className="approve";
approveBtn.textContent=words[lang].approve;
approveBtn.onclick=()=>reviewRequest(post.id,"approved");
const rejectBtn=document.createElement("button");
rejectBtn.className="reject";
rejectBtn.textContent=words[lang].reject;
rejectBtn.onclick=()=>reviewRequest(post.id,"rejected");
card.append(approveBtn,rejectBtn);
}

if(currentUser&&post.owner_id!==currentUser.id&&post.status==="approved"){
const reportBtn=document.createElement("button");
reportBtn.className="report";
reportBtn.textContent=words[lang].report;
reportBtn.onclick=()=>reportPost(post.id);
card.append(reportBtn);
}
box.appendChild(card);
});
}

async function loadAdminReports(){
if(!currentUser||!isAdmin)return;

const list=$("reportList");
list.textContent=words[lang].loading;

const {data,error}=await db.from("nb_reports")
.select("id,post_id,reporter_id,reason,status,created_at")
.order("created_at",{ascending:false});

if(error){
list.textContent=words[lang].error+error.message;
return;
}
list.replaceChildren();

if(!data||data.length===0){
list.textContent=words[lang].noReports;
return;
}

data.forEach(r=>{
const card=document.createElement("div");
card.className="request-card";

const reason=document.createElement("p");
reason.textContent=words[lang].reason+": "+r.reason;

const post=document.createElement("p");
post.textContent=words[lang].post+": "+r.post_id;

const reporter=document.createElement("p");
reporter.textContent=words[lang].reporter+": "+r.reporter_id;

const status=document.createElement("p");
status.textContent=words[lang].status+": "+(r.status||"pending");

card.append(reason,post,reporter,status);

if(r.status!=="reviewed"){
const btn=document.createElement("button");
btn.className="approve";
btn.textContent=words[lang].markReviewed;
btn.onclick=()=>markReportReviewed(r.id);
card.appendChild(btn);
}
list.appendChild(card);
});
}

async function markReportReviewed(reportId){
if(!isAdmin)return;

const {error}=await db.from("nb_reports")
.update({status:"reviewed"})
.eq("id",reportId);

if(error){
alert(words[lang].error+error.message);
return;
}
await loadAdminReports();
}

db.auth.onAuthStateChange(()=>{
setTimeout(()=>updateUser(),0);
});

changeLang("ps");
updateUser();
</script>
</body>
</html>
