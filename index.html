<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedBridge - وړیا مرسته</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#183047;text-align:center}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}

<p>مرسته له انسانه تر انسانه — وړیا او د ټولو لپاره</p>
</header>
<main>
<h2>د مرستې برخې</h2>
<div class="cards">
<div class="card">🍲 خواړه</div>
<div class="card">📚 زده کړې</div>
<div class="card">🏥 روغتیا</div>
<div class="card">👕 جامې</div>
<div class="card">🛂 ویزه او غوښتنلیک</div>
<div class="card">🤝 رضاکارانه مرسته</div>
</div>
<h2>زموږ موخه</h2>
<p>NeedBridge یوه وړیا نړیواله شبکه ده چې مرسته غوښتونکي له مرسته کوونکو سره نښلوي.</p>
</main>
<footer>NeedBridge © 2026 — وړیا مرسته د ټولو لپاره</footer>
</body>
</html>
