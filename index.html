<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeedBridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f3f8f6;margin:0;color:#173b39}
header{background:#087e72;color:white;padding:20px;text-align:center}
main{max-width:600px;margin:25px auto;padding:15px}
section{background:white;padding:22px;border-radius:14px;margin:15px 0}
input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{padding:12px 18px;background:#087e72;color:white;border:0;border-radius:8px;margin:5px;cursor:pointer}
.card{display:inline-block;background:white;padding:20px;margin:6px;border-radius:10px}
#message{padding:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>🌉 NeedBridge</h1>
<p>وړیا مرسته د ټولو لپاره</p>
</header>
<main>
<section>
<h2>د مرستې برخې</h2>
<div class="card">🍲 خواړه</div>
<div class="card">📚 زده کړې</div>
<div class="card">🏥 روغتیا</div>
<div class="card">👕 جامې</div>
<div class="card">🛂 ویزه</div>
<div class="card">🤝 رضاکارانه مرسته</div>
</section>

<section>
<h2>حساب ته ننوتل / نوی حساب</h2>
<input id="name" placeholder="بشپړ نوم (Full name)">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">نوی حساب جوړ کړه</button>
<button onclick="login()">Login / ننوتل</button>
<button onclick="logout()">Logout / وتل</button>
<p id="message">مهرباني وکړئ خپل معلومات ولیکئ.</p>
<p id="user"></p>
</section>
</main>
<script>
const db = window.supabase.createClient(
'https://urozgfqxtbjmejyyocow.supabase.co',
'sb_publishable_bac4hezW3ubW7BtEBjdi3g_3Qjrbv9T'
);

async function signup(){
const name=document.getElementById('name').value.trim();
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
if(!name||!email||password.length<6){
return show('نوم، ایمیل او لږ تر لږه ۶ توري پاسورډ ولیکئ.');
}
const {data,error}=await db.auth.signUp({
email,password,
options:{data:{full_name:name}}
});
if(error)return show(error.message);
show(data.session?'حساب جوړ شو!':'حساب جوړ شو. خپل ایمیل تایید کړئ.');
}

async function login(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error)return show(error.message);
show('په بریالیتوب داخل شوې!');
}

async function logout(){
const {error}=await db.auth.signOut();
if(error)return show(error.message);
show('له حسابه ووتلې.');
}

function show(text){
document.getElementById('message').textContent=text;
}

async function updateUser(){
const {data}=await db.auth.getUser();
document.getElementById('user').textContent=
data.user?'Logged in: '+data.user.email:'';
}

db.auth.onAuthStateChange(()=>updateUser());
updateUser();
</script>
</body>
</html>
